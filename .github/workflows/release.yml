name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, such as v0.1.0
        required: true
        type: string
      draft:
        description: Keep the release as a draft for review
        type: boolean
        default: true
      replace_assets:
        description: Replace assets of an existing published release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python scripts/release_metadata.py validate --tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  verify:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.version.outputs.sha }}

  publish:
    needs: [version, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Prepare source archive and checksums
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="piDeck-$RELEASE_VERSION/" --output="dist/piDeck-$RELEASE_VERSION-source.zip" HEAD
          python scripts/release_metadata.py checksums --directory dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        if: ${{ !github.event.repository.private || github.event.repository.owner.type != 'User' }}
        with:
          subject-path: dist/*
      - name: Report unsupported private-repository attestations
        if: ${{ github.event.repository.private && github.event.repository.owner.type == 'User' }}
        run: |
          echo 'GitHub does not support stored artifact attestations for user-owned private repositories. Source downloads are verified with SHA256SUMS; tagged-commit CI passed before publication.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          KEEP_DRAFT: ${{ github.event_name != 'workflow_dispatch' || inputs.draft }}
          REPLACE_ASSETS: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_assets }}
          PRIVATE_USER_REPO: ${{ github.event.repository.private && github.event.repository.owner.type == 'User' }}
        run: |
          NOTES_FILE="docs/releases/$RELEASE_TAG.md"
          if [ "$PRIVATE_USER_REPO" = true ]; then
            RELEASE_NOTES="$RUNNER_TEMP/release-notes.md"
            printf '%s\n\n' '**Download verification:** GitHub does not support stored artifact attestations for user-owned private repositories. This release provides SHA256SUMS and was built only after full CI passed for the exact tagged commit.' > "$RELEASE_NOTES"
            if [ -f "$NOTES_FILE" ]; then
              cat "$NOTES_FILE" >> "$RELEASE_NOTES"
            fi
            NOTES_FILE="$RELEASE_NOTES"
          fi
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-draft" 2>/dev/null; then
            if [ "$(cat "$RUNNER_TEMP/release-draft")" != true ] && [ "$REPLACE_ASSETS" != true ]; then
              echo "Published release unchanged. An explicit manual replace_assets run is required."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/* --clobber
            if [ -f "$NOTES_FILE" ]; then
              gh release edit "$RELEASE_TAG" --notes-file "$NOTES_FILE"
            fi
          else
            if [ -f "$NOTES_FILE" ]; then
              gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "piDeck $RELEASE_TAG" --notes-file "$NOTES_FILE"
            else
              gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "piDeck $RELEASE_TAG" --generate-notes
            fi
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --prerelease=true
          fi
          if [ "$KEEP_DRAFT" != true ]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
