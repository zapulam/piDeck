name: Desktop builds
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-desktop.txt pyinstaller
      - run: >-
          python -m PyInstaller --noconfirm --windowed --name piDeck
          --add-data "pideck/ui:pideck/ui" --collect-all webview
          --hidden-import uvicorn.logging
          --hidden-import uvicorn.protocols.http.h11_impl
          --hidden-import uvicorn.protocols.websockets.websockets_impl
          --hidden-import uvicorn.lifespan.on desktop_launcher.py
      - if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/piDeck.app dist/piDeck-macOS.zip
      - if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/piDeck -DestinationPath dist/piDeck-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: piDeck-${{ matrix.os }}
          path: dist/*.zip
