name: Desktop builds

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      targets:
        type: string
        default: '[{"os":"windows-latest","platform":"windows-x64"},{"os":"macos-26","platform":"macos-arm64"},{"os":"macos-15-intel","platform":"macos-x64"}]'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets || '[{"os":"windows-latest","platform":"windows-x64"},{"os":"macos-26","platform":"macos-arm64"},{"os":"macos-15-intel","platform":"macos-x64"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: ./.github/actions/package-desktop
        with:
          platform: ${{ matrix.platform }}
