name: Package desktop application
description: Build, smoke-test, and upload one native desktop archive.
inputs:
  platform:
    description: Platform and architecture label, such as windows-x64.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: python -m pip install -r requirements-build.txt
    - shell: bash
      env:
        PACKAGE_PLATFORM: ${{ inputs.platform }}
      run: python -m scripts.build_desktop --platform "$PACKAGE_PLATFORM"
    - shell: bash
      run: python -m scripts.smoke_desktop --executable-dir dist
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: desktop-${{ inputs.platform }}
        path: dist/*.zip
        if-no-files-found: error
        retention-days: 14
